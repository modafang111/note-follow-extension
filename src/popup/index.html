<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>note.com フォロー</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>note.com フォロー</h1>
      <span id="status-badge" class="badge idle">待機中</span>
    </header>

    <p class="hint">
      パスワードは使いません。Chrome で note.com にログインした Cookie を利用します。フォローしてくれた人を取り込み、まだ返していない相手をフォローします。
    </p>

    <div class="actions">
      <button id="import-btn" type="button">フォロワーを取り込んで開始</button>
    </div>
    <div class="actions">
      <button id="test-btn" type="button" class="secondary">テスト実行</button>
    </div>
    <div class="actions">
      <button id="start-btn" type="button" class="secondary">リストから開始</button>
      <button id="stop-btn" type="button" class="secondary" disabled>停止</button>
    </div>
    <p id="schedule-next" class="hint schedule-next">次回の自動フォロー: 未設定</p>

    <p id="error" class="error" hidden></p>

    <section class="progress-block">
      <div class="progress-meta">
        <span id="progress-label">0 / 0</span>
        <span id="current-label"></span>
      </div>
      <div class="bar" aria-hidden="true">
        <div id="bar-fill"></div>
      </div>
      <dl class="stats">
        <div><dt>フォロー</dt><dd id="followed">0</dd></div>
        <div><dt>スキップ</dt><dd id="skipped">0</dd></div>
        <div><dt>失敗</dt><dd id="failed">0</dd></div>
      </dl>
    </section>

    <section>
      <h2>ログ</h2>
      <ul id="log-list" class="log-list"></ul>
    </section>

    <section id="thanks-block" class="progress-block" hidden>
      <h2>フォロー返しのお礼</h2>
      <p id="thanks-meta" class="muted"></p>
      <pre id="thanks-preview" class="thanks-preview"></pre>
      <div class="actions">
        <button id="thanks-open" type="button">お礼を送り直す</button>
        <button id="thanks-skip" type="button" class="secondary">この人をスキップ</button>
      </div>
      <p class="hint">
        自動フォローでもお礼を送ります。送れなかった人はここに残るので、ボタンから送り直せます。
      </p>
    </section>

    <footer>
      <button id="options-btn" type="button" class="link">自動フォローと対象リストを設定</button>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
